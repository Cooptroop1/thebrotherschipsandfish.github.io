name: Update UK shop cod price

on:
  schedule:
    - cron: "20 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cod-price
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch supermarket prices
        run: python3 scripts/update-cod-price.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cod-price.json
          if git diff --staged --quiet; then
            echo "No price change"
          else
            git commit -m "Update UK supermarket cod price"
            git push
          fi
