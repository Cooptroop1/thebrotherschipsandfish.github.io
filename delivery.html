<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Delivery orders | The Brothers Chips and Fish</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --ink:#120e0b; --gold:#c9a227; --paper:#f4ead8; --card:#1c1713; --line:rgba(201,162,39,.28); --muted:#b9a894; }
        * { box-sizing:border-box; margin:0; padding:0; }
        body { font-family:"Source Sans 3",system-ui,sans-serif; background:var(--ink); color:var(--paper); }
        a { color:#e8c96a; }
        .wrap { width:min(860px, calc(100% - 24px)); margin:0 auto; padding:18px 0 40px; }
        h1 { font-family:Fraunces,serif; font-size:2rem; }
        .lead { color:var(--muted); margin:6px 0 16px; }
        label { display:block; font-weight:700; margin:10px 0 4px; }
        input { width:100%; max-width:420px; background:#120e0b; color:var(--paper); border:1px solid var(--line); border-radius:10px; padding:12px; font:inherit; }
        button { border:0; border-radius:999px; background:var(--gold); color:var(--ink); font:inherit; font-weight:700; padding:10px 14px; cursor:pointer; }
        .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; margin:10px 0; }
        .card h2 { font-family:Fraunces,serif; font-size:1.6rem; }
        .slot { color:var(--gold); font-family:Fraunces,serif; font-size:2.6rem; font-weight:700; line-height:1; }
        .muted { color:var(--muted); }
        .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
        .done { opacity:.55; }
        button.off { background:#3a3328; color:var(--paper); }
    </style>
</head>
<body>
    <div class="wrap">
        <p><a href="/admin.html">Pickup orders</a></p>
        <h1>Delivery run</h1>
        <p class="lead" id="note">Log in with the staff email.</p>
        <div id="login">
            <label for="email">Email</label>
            <input id="email" type="email" autocomplete="username">
            <label for="pass">Password</label>
            <input id="pass" type="password" autocomplete="current-password">
            <p style="margin-top:12px"><button id="go" type="button">Log in</button></p>
        </div>
        <div id="list"></div>
        <h2 id="binTitle" hidden style="margin-top:28px;font-family:Fraunces,serif">Cancelled</h2>
        <div id="binTools" hidden>
            <p class="lead">These are off the run. Restore puts that time back if nobody else has it. Delete removes it for good.</p>
            <label for="binDay">Look up a day</label>
            <input id="binDay" type="date">
        </div>
        <div id="bin"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="order-config.js?v=5"></script>
    <script>
        const CLOCK = {"4:30":"16:30","4:45":"16:45","5:00":"17:00","5:15":"17:15","5:30":"17:30","5:45":"17:45","6:00":"18:00","6:15":"18:15","6:30":"18:30","6:45":"18:45","7:00":"19:00"};
        const NEXT = { "new": "out", "out": "delivered" };
        const LABEL = { "new": "Out for delivery", "out": "Delivered" };
        let db = null;
        let timer = 0;
        function londonDate() {
            return new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/London" }).format(new Date());
        }
        function esc(value) {
            return String(value == null ? "" : value).replace(/[&<>"']/g, function (ch) {
                return "&#" + ch.charCodeAt(0) + ";";
            });
        }
        function money(pence) { return "£" + (Number(pence || 0) / 100).toFixed(2); }
        function client() {
            const cfg = window.ORDER_CONFIG || {};
            if (!db) db = window.supabase.createClient(cfg.url, cfg.anonKey);
            return db;
        }
        function itemsOf(order) {
            const items = Array.isArray(order.items) ? order.items : [];
            return items.map((item) => esc(item.qty) + " × " + esc(item.name)).join("<br>");
        }
        async function loadOrders() {
            const { data, error } = await client().from("deliveries").select("id,name,address,slot,items,total_pence,status,created_at").eq("day", londonDate()).order("created_at");
            if (error) {
                document.getElementById("note").textContent = /relation|deliveries/i.test(error.message || "")
                    ? "Delivery is not set up yet. The SQL still needs to be run in Supabase."
                    : (error.message || "Could not load deliveries.");
                return;
            }
            const rows = (data || []).filter((order) => order.status !== "cancelled" && order.slot !== "DELIVERY-OPEN" && order.slot !== "DELIVERY-OPEN-HALF");
            rows.sort((a, b) => String(a.slot).localeCompare(String(b.slot)));
            const list = document.getElementById("list");
            list.innerHTML = "";
            if (!rows.length) list.innerHTML = "<p class='lead'>No delivery orders for today.</p>";
            rows.forEach((order) => {
                const card = document.createElement("article");
                card.className = "card" + (order.status === "delivered" ? " done" : "");
                const state = order.status === "out" ? "On the way" : (String(order.name || "").indexOf("Pay later") === 0 ? "Pay later" : order.status);
                card.innerHTML = "<p class='slot'>" + esc(CLOCK[order.slot] || order.slot) + "</p><p class='muted'>" + esc(state) + "</p><h2>" + esc(order.address) + "</h2><p style='margin-top:8px'>" + esc(order.name) + "</p><p style='margin-top:8px'>" + itemsOf(order) + "</p><p class='muted'>" + money(order.total_pence) + "</p>";
                const actions = document.createElement("div");
                actions.className = "actions";
                if (NEXT[order.status]) {
                    const button = document.createElement("button");
                    button.type = "button";
                    button.textContent = LABEL[order.status];
                    button.onclick = () => setStatus(order.id, NEXT[order.status]);
                    actions.appendChild(button);
                }
                const cancel = document.createElement("button");
                cancel.type = "button";
                cancel.className = "off";
                cancel.textContent = "Cancel";
                cancel.onclick = () => setStatus(order.id, "cancelled");
                actions.appendChild(cancel);
                card.appendChild(actions);
                list.appendChild(card);
            });
            await paintBin(data || []);
        }
        async function paintBin(today) {
            const box = document.getElementById("bin");
            const day = document.getElementById("binDay").value || londonDate();
            let source = today;
            if (day !== londonDate()) {
                const older = await client().from("deliveries").select("id,name,address,slot,items,total_pence,status,created_at").eq("day", day).order("created_at");
                if (older.error) {
                    box.innerHTML = "<p class='lead'>Could not load that day.</p>";
                    return;
                }
                source = older.data || [];
            }
            const rows = source.filter((order) => order.status === "cancelled" && order.slot !== "DELIVERY-OPEN" && order.slot !== "DELIVERY-OPEN-HALF");
            rows.sort((a, b) => String(a.slot).localeCompare(String(b.slot)));
            box.innerHTML = "";
            if (!rows.length) {
                box.innerHTML = "<p class='lead'>Nothing cancelled on " + esc(day) + ".</p>";
                return;
            }
            rows.forEach((order) => {
                const card = document.createElement("article");
                card.className = "card done";
                card.innerHTML = "<p class='slot'>" + esc(CLOCK[order.slot] || order.slot) + "</p><p class='muted'>Cancelled</p><h2>" + esc(order.address) + "</h2><p style='margin-top:8px'>" + esc(order.name) + "</p><p style='margin-top:8px'>" + itemsOf(order) + "</p><p class='muted'>" + money(order.total_pence) + "</p>";
                const actions = document.createElement("div");
                actions.className = "actions";
                const restore = document.createElement("button");
                restore.type = "button";
                restore.textContent = "Restore";
                restore.onclick = () => restoreOrder(order);
                const remove = document.createElement("button");
                remove.type = "button";
                remove.className = "off";
                remove.textContent = "Delete for good";
                remove.onclick = () => removeOrder(order.id);
                actions.append(restore, remove);
                card.appendChild(actions);
                box.appendChild(card);
            });
        }
        async function restoreOrder(order) {
            const { error } = await client().from("deliveries").update({ status: "new" }).eq("id", order.id);
            const clash = error && (error.code === "23505" || /duplicate|unique|conflict/i.test(error.message || ""));
            document.getElementById("note").textContent = clash
                ? "That time is already booked, so this one stays cancelled."
                : (error ? (error.message || "Could not restore it.") : "That delivery is back on the run.");
            loadOrders();
        }
        async function removeOrder(id) {
            if (!window.confirm("Delete this delivery for good? It cannot be put back.")) return;
            const { error } = await client().from("deliveries").delete().eq("id", id);
            document.getElementById("note").textContent = error ? (error.message || "Could not delete it. The delete permission still needs to be added in Supabase.") : "Deleted for good.";
            loadOrders();
        }
        async function setStatus(id, status) {
            const { error } = await client().from("deliveries").update({ status }).eq("id", id);
            document.getElementById("note").textContent = error ? (error.message || "Could not update that order.") : "Updated.";
            loadOrders();
        }
        async function openRun() {
            document.getElementById("login").style.display = "none";
            const session = (await client().auth.getSession()).data.session;
            const email = session && session.user && session.user.email ? session.user.email.toLowerCase() : "";
            if (email !== "jcooper4888@aol.co.uk" && email !== "apandy94@yahoo.com") {
                document.getElementById("note").textContent = "This login is not staff.";
                return;
            }
            document.getElementById("note").textContent = "Deliveries for " + londonDate() + ". Pickup orders stay on the other page.";
            document.getElementById("binTitle").hidden = false;
            document.getElementById("binTools").hidden = false;
            const binDay = document.getElementById("binDay");
            if (!binDay.value) binDay.value = londonDate();
            binDay.onchange = () => loadOrders();
            await loadOrders();
            clearInterval(timer);
            timer = setInterval(loadOrders, 8000);
        }
        document.getElementById("go").onclick = async () => {
            document.getElementById("note").textContent = "Checking...";
            const { error } = await client().auth.signInWithPassword({
                email: document.getElementById("email").value.trim(),
                password: document.getElementById("pass").value
            });
            if (error) { document.getElementById("note").textContent = error.message; return; }
            openRun();
        };
        client().auth.getSession().then(({ data }) => { if (data.session) openRun(); });
    </script>
</body>
</html>
